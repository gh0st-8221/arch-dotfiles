[general]
border_width = 1
default_width = 1920
default_height = 1080
workspaces = 4
zoom_min = 0.4

[colors]
bg = "0x000000"
fg = "0xffffff"
border = "0x303030"
focus = "0x0000ff"

[monitors]
setup = "xrandr --auto; DP=$(xrandr | awk '$2 ~ /^connected$/ && $1 ~ /^DP/ {print $1; exit}'); HD=$(xrandr | awk '$2 ~ /^connected$/ && $1 ~ /^HDMI/ {print $1; exit}'); [ x$DP != x ] && [ x$HD != x ] && xrandr --output $DP --pos 0x0 --output $HD --pos 2560x310"
order = "2560x1440 1920x1080"
default = "2560x1440"

[autostart]
cmd = "killall dunst; dunst"
cmd = "setxkbmap -layout us,ua -option grp:win_space_toggle"

[keys]
Mod4+q = "alacritty"
Mod4+w = "firefox"
Mod4+s = "steam"
Mod4+c = "close-window"
Mod4+d = "rofi -show drun"
Mod4+p = "playerctl play-pause"
Mod4+Shift+p = "systemctl poweroff"
Mod4+t = "toggle-tiling"
Mod1+Tab = "alt-tab"
Mod4+m = "minimize"
Mod4+Shift+r = "killall -USR1 ghostwm"
Shift+Print = "xscreencopy"

Mod4+1 = "workspace 1"
Mod4+2 = "workspace 2"
Mod4+3 = "workspace 3"
Mod4+4 = "workspace 4"
Mod4+Shift+1 = "move-to-workspace 1"
Mod4+Shift+2 = "move-to-workspace 2"
Mod4+Shift+3 = "move-to-workspace 3"
Mod4+Shift+4 = "move-to-workspace 4"

Mod4+Left = "focus-left"
Mod4+Right = "focus-right"
Mod4+Up = "focus-up"
Mod4+Down = "focus-down"
Mod4+Shift+Left = "move-left"
Mod4+Shift+Right = "move-right"
Mod4+Shift+Up = "move-up"
Mod4+Shift+Down = "move-down"

Mod1+1 = "send-to-monitor 1920x1080"
Mod1+2 = "send-to-monitor 2560x1440"
Mod1+Shift+1 = "focus-monitor 1920x1080"
Mod1+Shift+2 = "focus-monitor 2560x1440"

Mod4+Mod1+Left = "send-to-monitor left"
Mod4+Mod1+Right = "send-to-monitor right"
Mod4+Mod1+Up = "send-to-monitor up"
Mod4+Mod1+Down = "send-to-monitor down"
Mod4+o = "send-to-monitor next"
Mod4+Control+Left = "focus-monitor left"
Mod4+Control+Right = "focus-monitor right"
Mod4+Control+Up = "focus-monitor up"
Mod4+Control+Down = "focus-monitor down"

Mod4+Control+equal = "zoom-in"
Mod4+Control+minus = "zoom-out"
Mod4+Control+0 = "zoom-reset"

Mod4+minus = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%- && dunstify -a Volume -u low -r 9999 -t 800 'Volume: '$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}')'%'"
Mod4+equal = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+ && dunstify -a Volume -u low -r 9999 -t 800 'Volume: '$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}')'%'"
